<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>임용수학 기출풀이</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#ebe5db;
  --s1:#f5f0e8;
  --s2:#ebe5db;
  --s3:#ddd7cc;
  --b1:rgba(0,0,0,0.08);
  --b2:rgba(0,0,0,0.15);
  --t1:#26201a;
  --t2:#5a5047;
  --t3:#7a6e63;
  --t4:#a89e94;
  --g:#1a6b40;  --g-bg:#edf7f1; --g-bd:rgba(26,107,64,0.22);
  --gr:#1a4a9f; --gr-bg:#eef3fd; --gr-bd:rgba(26,74,159,0.22);
  --r:#9f1a6b;  --r-bg:#fceef6; --r-bd:rgba(159,26,107,0.22);
  --acc:#b5730c; --acc-bg:#fef8ec; --acc-bd:rgba(181,115,12,0.28);
  --rad:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;padding-bottom:60px;line-height:1.65}

/* ── sticky nav ── */
.nav-sticky{position:sticky;top:0;z-index:100;background:var(--bg)}
.hdr{background:var(--s1);border-bottom:1px solid var(--b1);padding:14px 18px 12px}
.hdr-row{display:flex;align-items:baseline;gap:10px}
.hdr-title{font-size:16px;font-weight:700;letter-spacing:-0.3px}
.hdr-cnt{font-size:11px;color:var(--t3)}

/* subject bar */
.subj-bar{background:var(--bg);border-bottom:1px solid var(--b1);overflow-x:auto;scrollbar-width:none}
.subj-bar::-webkit-scrollbar{display:none}
.subj-inner{display:flex;padding:0 14px;gap:2px}
.subj-btn{flex-shrink:0;padding:9px 14px;border:none;background:none;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;color:var(--t3);cursor:pointer;position:relative;transition:color .15s;white-space:nowrap}
.subj-btn.on{color:var(--t1)}
.subj-btn.on::after{content:'';position:absolute;bottom:0;left:8px;right:8px;height:2px;background:var(--acc);border-radius:1px}

/* view tabs */
.view-bar{background:var(--s1);border-bottom:1px solid var(--b1);display:flex}
.view-btn{flex:1;padding:11px;border:none;background:none;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;color:var(--t3);cursor:pointer;position:relative;transition:color .15s}
.view-btn.on{color:var(--t1)}
.view-btn.on::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;background:var(--acc);border-radius:1px}

/* ── year pills ── */
.yr-bar{overflow-x:auto;scrollbar-width:none;padding:10px 14px 8px;background:var(--bg);border-bottom:1px solid var(--b1)}
.yr-bar::-webkit-scrollbar{display:none}
.yr-inner{display:flex;gap:5px;width:max-content}
.yr-pill{padding:4px 10px;border-radius:20px;border:1px solid var(--b2);background:none;font-family:'DM Mono',monospace;font-size:11px;color:var(--t2);cursor:pointer;transition:all .15s;white-space:nowrap}
.yr-pill.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}

/* cat filter */
.cat-bar{overflow-x:auto;scrollbar-width:none;padding:7px 14px;background:var(--bg)}
.cat-bar::-webkit-scrollbar{display:none}
.cat-inner{display:flex;gap:5px}
.cb{flex-shrink:0;padding:4px 13px;border-radius:20px;border:1px solid var(--b2);background:none;font-family:'Noto Sans KR',sans-serif;font-size:11px;color:var(--t2);cursor:pointer;transition:all .15s}
.cb.on-all{background:var(--s2);color:var(--t1);border-color:var(--b2)}

/* freq cat tabs */
.fcat-bar{padding:10px 14px 4px;background:var(--bg)}
.fcat-inner{display:flex;gap:7px}
.fcat-btn{flex:1;padding:10px 6px;border-radius:10px;border:1px solid var(--b1);background:var(--s1);font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:600;color:var(--t3);cursor:pointer;transition:all .15s;text-align:center;line-height:1.5}
.fcat-btn .fc-stars{display:block;font-size:8px;letter-spacing:1px;margin-top:2px;font-weight:400}
.fcat-btn .fc-cnt{display:block;font-size:9px;font-family:'DM Mono',monospace;font-weight:400;margin-top:1px}


/* ── content ── */
.wrap{max-width:680px;margin:0 auto;padding:6px 12px}

/* year section header */
.yr-sec{display:flex;align-items:center;gap:7px;padding:12px 0 7px}
.yr-sec-yr{font-family:'DM Mono',monospace;font-size:11px;font-weight:700;color:var(--acc)}
.yr-sec-line{flex:1;height:1px;background:var(--b1)}
.yr-sec-cnt{font-size:10px;color:var(--t3);font-family:'DM Mono',monospace}

/* ── card ── */
.card{background:var(--s1);border-radius:var(--rad);margin:5px 0;border:1px solid var(--b1);border-left-width:3px;border-left-style:solid;overflow:hidden;transition:border-color .15s}
.card:hover{border-color:var(--b2)}
.card-head{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;cursor:pointer;user-select:none}
.card-meta{flex:1;min-width:0}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px}
.tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:6px;letter-spacing:.03em;font-family:'DM Mono',monospace}
.t-yr{background:var(--s2);color:var(--t3)}
.t-a{background:var(--gr-bg);color:var(--gr)}
.t-b{background:var(--g-bg);color:var(--g)}
.t-pts{background:var(--acc-bg);color:var(--acc)}
.t-g{background:var(--g-bg);color:var(--g)}
.t-gr{background:var(--gr-bg);color:var(--gr)}
.t-r{background:var(--r-bg);color:var(--r)}
.card-title{font-size:13px;font-weight:600;color:var(--t1);line-height:1.45}
.chev{width:22px;height:22px;border-radius:50%;border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--t3);transition:all .2s;margin-top:1px}
.chev svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.card.open .chev{background:var(--t1);border-color:var(--t1);color:#000}
.card.open .chev svg{transform:rotate(180deg)}

/* ── card body ── */
.card-body{display:none;border-top:1px solid var(--b1)}
.card.open .card-body{display:block}

.prob-box{background:var(--s2);padding:13px 14px;border-bottom:1px solid var(--b1)}
.box-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.prob-text{font-size:13px;line-height:1.95;color:var(--t2)}
.diagram-box{background:var(--s1);padding:14px 10px;border-bottom:1px solid var(--b1);display:flex;justify-content:center}
.diagram-box svg{max-width:100%;height:auto;display:block}

.sol{padding:14px}
.step{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--b1)}
.step:last-of-type{border-bottom:none;margin-bottom:0;padding-bottom:0}
.step-hd{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.step-num{font-family:'DM Mono',monospace;font-size:9px;font-weight:700;padding:2px 8px;border-radius:4px;flex-shrink:0;letter-spacing:.04em}
.step-ttl{font-size:11px;font-weight:600;color:var(--t2)}
.step-body{font-size:13px;line-height:1.95;color:var(--t1)}

/* KaTeX display blocks */
.katex-display{background:var(--s3);border-radius:8px;padding:10px 14px;margin:8px 0;overflow-x:auto;border:1px solid var(--b1)}

.ans-box{background:var(--acc-bg);border:1px solid var(--acc-bd);border-radius:10px;padding:11px 14px;margin-top:14px}
.ans-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:5px}
.ans-val{font-size:14px;font-weight:700;color:var(--t1)}

.fns{margin-top:14px;padding-top:11px;border-top:1px solid var(--b1)}
.fn-hd{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:7px}
.fn-row{display:flex;gap:7px;margin-bottom:6px}
.fn-n{font-family:'DM Mono',monospace;font-size:10px;color:var(--acc);font-weight:700;flex-shrink:0;padding-top:1px;min-width:14px}
.fn-t{font-size:11px;color:var(--t3);line-height:1.6}

.empty{text-align:center;padding:48px 20px;color:var(--t3);font-size:13px}

@media(max-width:480px){
  .card-title{font-size:12px}
  .step-body,.prob-text{font-size:12px}
}
</style>
</head>
<body>

<div class="nav-sticky">
  <div class="hdr">
    <div class="hdr-row">
      <span class="hdr-title">임용수학 기출풀이</span>
      <span class="hdr-cnt" id="hdr-cnt"></span>
    </div>
  </div>
  <div class="subj-bar"><div class="subj-inner" id="subj-tabs"></div></div>
  <div class="view-bar">
    <button class="view-btn on" onclick="switchView('year',this)">📅 연도순</button>
    <button class="view-btn"   onclick="switchView('freq',this)">⭐ 빈도순</button>
  </div>
</div>

<div id="nav-area"></div>
<div class="wrap"><div id="content-area"></div></div>

<!-- ▼ KaTeX 동기 로드 (타이밍 문제 해결) -->
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="data-현대대수.js"></script>
<script src="data-해석학.js"></script>
<script src="data-복소해석학.js"></script>
<script src="data-미분기하학.js"></script>
<script src="data-선형대수학.js"></script>
<script src="data-이산수학.js"></script>
<script src="data-정수론.js"></script>
<script src="data-확률과통계.js"></script>
<script>
// ── state ──
let CUR_SUBJ = null, CUR_VIEW = 'year', CUR_YEAR = null, CUR_CAT = null, CUR_FCAT = null;

const YEARS = [2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026];

// 현재 과목의 카테고리 정보를 id로 조회 (색상은 각 data-XX.js의 categories/freqGroups에서 가져옴)
function getCatInfo(catId) {
  const s = window.SUBJECTS[CUR_SUBJ];
  if (!s) return null;
  return (s.categories || []).find(c => c.id === catId)
      || (s.freqGroups || []).find(g => g.id === catId)
      || null;
}

// ── KaTeX ──
function renderMath(el) {
  if (typeof window.renderMathInElement !== 'function') return;
  window.renderMathInElement(el || document.getElementById('content-area'), {
    delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
    throwOnError:false, strict:false
  });
}

// ── init ──
document.addEventListener('DOMContentLoaded', () => {
  const keys = Object.keys(window.SUBJECTS || {});
  // subject tabs
  document.getElementById('subj-tabs').innerHTML = keys.map((k,i) =>
    `<button class="subj-btn${i===0?' on':''}" onclick="selSubj('${k}',this)">${window.SUBJECTS[k].label}</button>`
  ).join('');
  if (keys.length) selSubj(keys[0]);
});

function selSubj(key, btn) {
  CUR_SUBJ = key;
  CUR_YEAR = null; CUR_CAT = null;
  const s = window.SUBJECTS[key];
  CUR_FCAT = s.freqGroups?.[0]?.id || null;
  document.getElementById('hdr-cnt').textContent = `2014~2026 · ${(s.problems||[]).length}문제`;
  document.querySelectorAll('.subj-btn').forEach(b=>b.classList.remove('on'));
  (btn || document.querySelector('.subj-btn'))?.classList.add('on');
  render();
}

function switchView(v, btn) {
  CUR_VIEW = v;
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

// ── render ──
function render() {
  if (!CUR_SUBJ) return;
  renderNav();
  renderContent();
  setTimeout(()=>renderMath(), 80);
}

function renderNav() {
  const el = document.getElementById('nav-area');
  const s = window.SUBJECTS[CUR_SUBJ];
  const cats = s.categories || [];

  if (CUR_VIEW === 'year') {
    const hasYear = y => (s.problems||[]).some(p=>p.year===y);
    el.innerHTML = `
      <div class="yr-bar">
        <div class="yr-inner">
          <button class="yr-pill${CUR_YEAR===null?' on':''}" onclick="setYear(null,this)">전체</button>
          ${YEARS.filter(hasYear).map(y=>`<button class="yr-pill${CUR_YEAR===y?' on':''}" onclick="setYear(${y},this)">'${String(y).slice(2)}</button>`).join('')}
        </div>
      </div>
      <div class="cat-bar">
        <div class="cat-inner">
          <button class="cb${CUR_CAT===null?' on-all':''}" onclick="setCat(null,this)">전체</button>
          ${cats.map(c=>`<button class="cb" style="${CUR_CAT===c.id?`background:${c.light};color:${c.color};border-color:${c.color}55`:''}" onclick="setCat('${c.id}',this)">${esc(c.name)}</button>`).join('')}
        </div>
      </div>`;
  } else {
    const groups = s.freqGroups || [];
    el.innerHTML = `
      <div class="fcat-bar">
        <div class="fcat-inner">
          ${groups.map(g=>`<button class="fcat-btn" style="${CUR_FCAT===g.id?`background:${g.color}18;color:${g.color};border-color:${g.color}55`:''}" onclick="setFcat('${g.id}',this)">
            ${esc(g.name)}
            <span class="fc-stars">${esc(g.stars)}</span>
            <span class="fc-cnt">${g.count}회 출제</span>
          </button>`).join('')}
        </div>
      </div>`;
  }
}

function setYear(y, btn) {
  CUR_YEAR = y;
  document.querySelectorAll('.yr-pill').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderContent(); setTimeout(()=>renderMath(),80);
}

function setCat(c, btn) {
  CUR_CAT = c;
  document.querySelectorAll('.cb').forEach(b=>{b.className='cb';b.removeAttribute('style');});
  if (c===null) {
    btn.className = 'cb on-all';
  } else {
    const info = getCatInfo(c);
    btn.className = 'cb';
    if (info) btn.style.cssText = `background:${info.light};color:${info.color};border-color:${info.color}55`;
  }
  renderContent(); setTimeout(()=>renderMath(),80);
}

function setFcat(c, btn) {
  CUR_FCAT = c;
  document.querySelectorAll('.fcat-btn').forEach(b=>{b.className='fcat-btn';b.removeAttribute('style');});
  const info = getCatInfo(c);
  btn.className = 'fcat-btn';
  if (info) btn.style.cssText = `background:${info.color}18;color:${info.color};border-color:${info.color}55`;
  renderContent(); setTimeout(()=>renderMath(),80);
}

// ── content ──
function renderContent() {
  const el = document.getElementById('content-area');
  if (!CUR_SUBJ) { el.innerHTML=''; return; }
  const s = window.SUBJECTS[CUR_SUBJ];
  el.innerHTML = CUR_VIEW==='year' ? buildYear(s) : buildFreq(s);
}

function buildYear(s) {
  let probs = s.problems || [];
  if (CUR_CAT) probs = probs.filter(p=>p.cat===CUR_CAT);
  if (CUR_YEAR !== null) {
    const yp = probs.filter(p=>p.year===CUR_YEAR);
    return yp.length ? yp.map(p=>cardHtml(p)).join('') : '<div class="empty">해당 연도 문제가 없어요</div>';
  }
  const years = [...new Set(probs.map(p=>p.year))].sort();
  if (!years.length) return '<div class="empty">해당하는 문제가 없어요</div>';
  return years.map(y=>{
    const yp = probs.filter(p=>p.year===y);
    return `<div class="yr-sec">
      <span class="yr-sec-yr">${y}</span>
      <span class="yr-sec-line"></span>
      <span class="yr-sec-cnt">${yp.length}문제</span>
    </div>${yp.map(p=>cardHtml(p)).join('')}`;
  }).join('');
}

function buildFreq(s) {
  if (!CUR_FCAT) return '<div class="empty">카테고리를 선택해주세요</div>';
  const g = (s.freqGroups||[]).find(g=>g.id===CUR_FCAT);
  if (!g) return '';
  const probs = (g.problems||[]).map(id=>(s.problems||[]).find(p=>p.id===id)).filter(Boolean)
    .sort((a,b)=>b.pts-a.pts||b.year-a.year);
  return probs.length ? probs.map(p=>cardHtml(p)).join('') : '<div class="empty">문제가 없어요</div>';
}

// ── card ──
// LaTeX/문제 텍스트에 '<', '>', '&'가 그대로 들어가면(예: "0<x<1") 브라우저가
// innerHTML 파싱 시 이를 HTML 태그 시작으로 오인해 카드 구조가 깨지고
// 뒤따르는 카드들까지 하나로 합쳐져 보이는 버그가 있었음. 렌더링 직전에 이스케이프 처리.
function esc(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function catName(cat){ const c=getCatInfo(cat); return c ? c.name : cat; }

function cardHtml(p) {
  const c = getCatInfo(p.cat);
  const catColor = c ? c.color : '#888';
  const catLight = c ? c.light : '#eee';
  return `<div class="card" id="c-${p.id}" data-cat="${p.cat}" style="border-left-color:${catColor}">
  <div class="card-head" onclick="toggleCard('${p.id}')">
    <div class="card-meta">
      <div class="tags">
        <span class="tag t-yr">${p.year}</span>
        <span class="tag ${p.type==='전공A'?'t-a':'t-b'}">${p.type}</span>
        <span class="tag" style="background:${catLight};color:${catColor}">${esc(catName(p.cat))}</span>
        <span class="tag t-pts">${p.pts}점</span>
      </div>
      <div class="card-title">${esc(p.title)}</div>
    </div>
    <div class="chev"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></div>
  </div>
  <div class="card-body">
    <div class="prob-box">
      <div class="box-lbl">문제</div>
      <div class="prob-text">${esc(p.problem)}</div>
    </div>
    ${p.diagram ? `<div class="diagram-box">${p.diagram}</div>` : ''}
    <div class="sol">
      ${(p.steps||[]).map((st,i)=>`<div class="step">
        <div class="step-hd">
          <span class="step-num" style="background:${catLight};color:${catColor}">STEP ${i+1}</span>
          <span class="step-ttl">${esc(st.title)}</span>
        </div>
        <div class="step-body">${esc(st.body)}</div>
      </div>`).join('')}
      <div class="ans-box">
        <div class="ans-lbl">정답</div>
        <div class="ans-val">${esc(p.answer)}</div>
      </div>
      ${p.footnotes?.length?`<div class="fns">
        <div class="fn-hd">개념 각주</div>
        ${p.footnotes.map(f=>`<div class="fn-row"><span class="fn-n">${esc(f.n)}</span><span class="fn-t">${esc(f.text)}</span></div>`).join('')}
      </div>`:''}
    </div>
  </div>
</div>`;
}

function toggleCard(id) {
  const c = document.getElementById('c-'+id);
  c.classList.toggle('open');
  if (c.classList.contains('open')) {
    setTimeout(()=>renderMath(c), 50);
  }
}
</script>
</body>
</html>
